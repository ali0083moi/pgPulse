version: '3.8'

services:
  pgpulse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pgpulse
    ports:
      - "3001:3001"
    volumes:
      # Mount Docker socket to enable automatic discovery of running PostgreSQL containers
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    environment:
      - PORT=3001
